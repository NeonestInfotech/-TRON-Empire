<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TRON Empire - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #02030a;
            color: #ffffff;
        }

        /* =========================================
           PAGE
        ========================================= */

        .login-page {
            position: relative;

            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(124, 58, 237, .20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 15% 80%,
                    rgba(37, 99, 235, .14),
                    transparent 28%
                ),
                #02030a;
        }

        /* =========================================
           GRID
        ========================================= */

        .grid {
            position: absolute;

            width: 180%;
            height: 180%;

            left: -40%;
            top: -20%;

            background-image:
                linear-gradient(
                    rgba(124, 58, 237, .11) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(124, 58, 237, .11) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            transform:
                perspective(500px)
                rotateX(60deg);

            transform-origin:
                center bottom;

            animation:
                gridAnimation 12s linear infinite;

            opacity: .55;
        }

        @keyframes gridAnimation {

            from {
                background-position:
                    0 0,
                    0 0;
            }

            to {
                background-position:
                    0 550px,
                    0 550px;
            }
        }

        /* =========================================
           BIG GLOW
        ========================================= */

        .background-glow {

            position: absolute;

            width: 600px;
            height: 600px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(124, 58, 237, .20),
                    transparent 68%
                );

            filter: blur(40px);

            animation:
                glowAnimation 7s
                ease-in-out infinite alternate;
        }

        @keyframes glowAnimation {

            from {
                transform:
                    translate(-180px, -80px)
                    scale(.8);
            }

            to {
                transform:
                    translate(180px, 80px)
                    scale(1.25);
            }
        }

        /* =========================================
           SCAN LINE
        ========================================= */

        .scan-line {

            position: absolute;

            left: 0;

            width: 100%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #3b82f6,
                    #8b5cf6,
                    #22d3ee,
                    #3b82f6,
                    transparent
                );

            box-shadow:
                0 0 12px #8b5cf6,
                0 0 25px #3b82f6;

            opacity: .65;

            animation:
                scanAnimation 5s linear infinite;
        }

        @keyframes scanAnimation {

            from {
                top: -5%;
            }

            to {
                top: 105%;
            }
        }

        /* =========================================
           PARTICLES
        ========================================= */

        .particles {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }

        .particle {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #8b5cf6;

            box-shadow:
                0 0 7px #8b5cf6,
                0 0 16px #3b82f6;

            animation:
                particleAnimation
                linear infinite;
        }

        @keyframes particleAnimation {

            0% {
                transform:
                    translateY(100px)
                    scale(.3);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            80% {
                opacity: .8;
            }

            100% {
                transform:
                    translateY(-110vh)
                    scale(1.4);

                opacity: 0;
            }
        }

        /* =========================================
           BRAND
        ========================================= */

        .brand {

            position: absolute;

            top: 28px;
            left: 32px;

            z-index: 20;

            display: flex;
            align-items: center;

            gap: 10px;

            color: #ffffff;

            text-decoration: none;

            font-size: 18px;
            font-weight: 900;
        }

        .brand span {
            color: #a78bfa;
        }

        .brand-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #8b5cf6;

            box-shadow:
                0 0 8px #8b5cf6,
                0 0 20px #3b82f6;

            animation:
                dotPulse 1.5s infinite;
        }

        @keyframes dotPulse {

            50% {
                transform: scale(1.5);
                opacity: .5;
            }
        }

        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-button {

            position: absolute;

            top: 23px;
            right: 30px;

            z-index: 20;

            padding: 10px 18px;

            border:
                1px solid
                rgba(139, 92, 246, .35);

            border-radius: 9px;

            color:
                rgba(255,255,255,.7);

            text-decoration: none;

            background:
                rgba(10,7,25,.65);

            backdrop-filter: blur(12px);

            font-size: 12px;

            transition: .3s ease;
        }

        .back-button:hover {

            color: #ffffff;

            border-color: #8b5cf6;

            box-shadow:
                0 0 20px
                rgba(124,58,237,.35);
        }

        /* =========================================
           LOGIN WRAPPER
        ========================================= */

        .login-wrapper {

            position: relative;

            z-index: 10;

            width:
                min(450px, calc(100% - 30px));

            animation:
                loginEntrance
                1.1s
                cubic-bezier(.2,.8,.2,1);
        }

        @keyframes loginEntrance {

            from {

                opacity: 0;

                transform:
                    translateY(50px)
                    scale(.90);

                filter: blur(12px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter: blur(0);
            }
        }

        /* =========================================
           CARD
        ========================================= */

        .login-card {

            position: relative;

            padding: 40px 38px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17,13,39,.95),
                    rgba(3,5,17,.97)
                );

            border:
                1px solid
                rgba(139,92,246,.35);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.75),

                0 0 60px
                rgba(124,58,237,.15),

                inset 0 0 40px
                rgba(124,58,237,.04);

            backdrop-filter:
                blur(25px);

            overflow: hidden;
        }

        .login-card::before {

            content: "";

            position: absolute;

            inset: -2px;

            border-radius: 25px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #3b82f6,
                    #8b5cf6,
                    #22d3ee,
                    #3b82f6,
                    transparent
                );

            background-size:
                300% 100%;

            animation:
                borderAnimation
                5s linear infinite;

            opacity: .7;

            z-index: -1;
        }

        @keyframes borderAnimation {

            from {
                background-position: 0% 50%;
            }

            to {
                background-position: 300% 50%;
            }
        }

        /* =========================================
           LOGO
        ========================================= */

        .login-logo {

            position: relative;

            width: 105px;
            height: 105px;

            margin:
                0 auto 22px;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .login-logo::before {

            content: "";

            position: absolute;

            inset: -4px;

            border-radius: 50%;

            border:
                1px solid
                rgba(59,130,246,.65);

            box-shadow:
                0 0 20px
                rgba(59,130,246,.25);

            animation:
                rotateRing 7s linear infinite;
        }

        .login-logo::after {

            content: "";

            position: absolute;

            inset: 8px;

            border-radius: 50%;

            border:
                1px dashed
                rgba(139,92,246,.65);

            animation:
                rotateRingReverse 5s linear infinite;
        }

        @keyframes rotateRing {

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateRingReverse {

            to {
                transform: rotate(-360deg);
            }
        }

        .login-logo img {

            position: relative;

            z-index: 5;

            width: 72px;
            height: 72px;

            object-fit: contain;

            border-radius: 12px;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(59,130,246,.9)
                )
                drop-shadow(
                    0 0 25px
                    rgba(139,92,246,.6)
                );

            animation:
                logoFloat
                3s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        /* =========================================
           TITLE
        ========================================= */

        .login-title {

            text-align: center;

            font-size: 31px;

            font-weight: 900;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a78bfa,
                    #60a5fa,
                    #22d3ee,
                    #ffffff
                );

            background-size: 300% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                titleAnimation
                5s linear infinite;
        }

        @keyframes titleAnimation {

            to {
                background-position: 300% center;
            }
        }

        .login-subtitle {

            text-align: center;

            color:
                rgba(255,255,255,.45);

            font-size: 13px;

            margin-bottom: 30px;
        }

        /* =========================================
           FORM
        ========================================= */

        .form-group {

            margin-bottom: 18px;
        }

        .form-label {

            display: block;

            margin-bottom: 8px;

            color:
                rgba(255,255,255,.7);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        .input-wrapper {

            position: relative;
        }

        .input-icon {

            position: absolute;

            left: 16px;
            top: 50%;

            transform:
                translateY(-50%);

            z-index: 2;

            color: #a78bfa;

            font-size: 16px;
        }

        .login-input {

            width: 100%;

            height: 53px;

            padding:
                0 16px 0 45px;

            border-radius: 12px;

            border:
                1px solid
                rgba(139,92,246,.22);

            outline: none;

            background:
                rgba(2,3,12,.8);

            color: #ffffff;

            font-size: 14px;

            transition: .3s ease;
        }

        .login-input::placeholder {

            color:
                rgba(255,255,255,.25);
        }

        .login-input:focus {

            border-color:
                #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(139,92,246,.10),

                0 0 25px
                rgba(124,58,237,.18);
        }

        .login-input.invalid {

            border-color:
                #ef4444;

            box-shadow:
                0 0 15px
                rgba(239,68,68,.15);
        }

        .login-input.valid {

            border-color:
                #22c55e;
        }

        /* =========================================
           ERROR
        ========================================= */

        .error-message {

            display: none;

            margin-top: 6px;

            color: #f87171;

            font-size: 11px;
        }

        .error-message.show {
            display: block;
        }

        /* =========================================
           OPTIONS
        ========================================= */

        .login-options {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            margin:
                3px 0 23px;

            font-size: 12px;
        }

        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color:
                rgba(255,255,255,.5);
        }

        .remember input {

            accent-color:
                #8b5cf6;
        }

        .forgot {

            color:
                #a78bfa;

            text-decoration: none;

            transition: .3s;
        }

        .forgot:hover {

            color: #22d3ee;

            text-shadow:
                0 0 10px #22d3ee;
        }

        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            position: relative;

            width: 100%;
            height: 54px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            color: #ffffff;

            font-size: 13px;

            font-weight: 900;

            letter-spacing: 1.4px;

            overflow: hidden;

            background:
                linear-gradient(
                    100deg,
                    #2563eb,
                    #7c3aed,
                    #8b5cf6,
                    #0891b2,
                    #2563eb
                );

            background-size:
                300% 100%;

            box-shadow:
                0 10px 35px
                rgba(124,58,237,.28);

            animation:
                buttonAnimation
                5s linear infinite;

            transition: .3s ease;
        }

        @keyframes buttonAnimation {

            to {
                background-position:
                    300% 50%;
            }
        }

        .login-button:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 45px
                rgba(124,58,237,.45),

                0 0 30px
                rgba(34,211,238,.15);
        }

        .login-button:disabled {

            cursor:
                not-allowed;

            opacity: .7;

            transform: none;
        }

        .login-button::before {

            content: "";

            position: absolute;

            left: -100%;

            top: 0;

            width: 60%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.4),
                    transparent
                );

            transform:
                skewX(-20deg);

            animation:
                buttonShine
                3s infinite;
        }

        @keyframes buttonShine {

            0% {
                left: -100%;
            }

            45%,
            100% {
                left: 150%;
            }
        }

        /* =========================================
           STATUS
        ========================================= */

        .status {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            margin-top: 22px;

            color:
                rgba(255,255,255,.35);

            font-size: 11px;
        }

        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                #22c55e;

            box-shadow:
                0 0 10px #22c55e;

            animation:
                statusPulse
                1.5s infinite;
        }

        @keyframes statusPulse {

            50% {
                transform: scale(1.4);
                opacity: .5;
            }
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media(max-width: 600px) {

            .brand {

                top: 18px;
                left: 18px;

                font-size: 15px;
            }

            .back-button {

                top: 15px;
                right: 15px;

                padding:
                    8px 12px;
            }

            .login-card {

                padding:
                    32px 22px;
            }

            .login-title {

                font-size: 27px;
            }

            .login-logo {

                width: 90px;
                height: 90px;
            }

            .login-logo img {

                width: 63px;
                height: 63px;
            }
        }

    </style>
</head>

<body>

    <div class="login-page">

      


        <!-- Brand -->
        <a href="index.html" class="brand">

            <span class="brand-dot"></span>

            TRON <span>Empire</span>

        </a>


        <!-- Back -->
       


        <!-- Particles -->
        <div
            class="particles"
            id="particles"
        ></div>


        <!-- Login -->
        <div class="login-wrapper">

            <div class="login-card">

                <!-- YOUR UPLOADED LOGO -->
                <div class="login-logo">

                    <img
                        src="isometric-cloud-hex.png"
                        alt="TRON Empire Logo"
                    >

                </div>


                <h1 class="login-title">
                    Welcome Back
                </h1>


                <p class="login-subtitle">
                    Enter the Empire mainframe
                </p>


                <form
                    id="loginForm"
                    novalidate
                >

                    <!-- EMAIL -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="email"
                        >
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ✉
                            </span>

                            <input
                                id="email"
                                class="login-input"
                                type="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                            >

                        </div>

                        <div
                            id="emailError"
                            class="error-message"
                        >
                            Please enter a valid email address.
                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="password"
                        >
                            Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔐
                            </span>

                            <input
                                id="password"
                                class="login-input"
                                type="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            >

                        </div>

                        <div
                            id="passwordError"
                            class="error-message"
                        >
                            Password must be at least 6 characters.
                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="login-options">

                        <label class="remember">

                            <input
                                id="remember"
                                type="checkbox"
                                checked
                            >

                            Remember me

                        </label>


                        <a
                            href="#"
                            class="forgot"
                            id="forgotPassword"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >

                        <span id="buttonText">
                            LOGIN TO EMPIRE
                        </span>

                    </button>

                </form>


                <!-- STATUS -->

                <div class="status">

                    <span class="status-dot"></span>

                    Secure connection active

                </div>

            </div>

        </div>

    </div>


    <script>

        /* =========================================
           ONE-TIME LOGIN CHECK
        ========================================= */

        const alreadyLoggedIn =
            localStorage.getItem(
                "tronEmpireLoggedIn"
            );

        if (alreadyLoggedIn === "true") {

            /*
             * User has already logged in.
             * Send them directly to index.html.
             */

            window.location.href =
                "index.html";
        }


        /* =========================================
           PARTICLES
        ========================================= */

        const particles =
            document.getElementById(
                "particles"
            );

        for (
            let i = 0;
            i < 45;
            i++
        ) {

            const particle =
                document.createElement("span");

            particle.className =
                "particle";

            particle.style.left =
                Math.random() * 100 + "%";

            particle.style.top =
                (
                    65 +
                    Math.random() * 35
                ) + "%";

            particle.style.animationDuration =
                (
                    6 +
                    Math.random() * 10
                ) + "s";

            particle.style.animationDelay =
                Math.random() * 8 + "s";

            particles.appendChild(
                particle
            );
        }


        /* =========================================
           ELEMENTS
        ========================================= */

        const form =
            document.getElementById(
                "loginForm"
            );

        const email =
            document.getElementById(
                "email"
            );

        const password =
            document.getElementById(
                "password"
            );

        const emailError =
            document.getElementById(
                "emailError"
            );

        const passwordError =
            document.getElementById(
                "passwordError"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const buttonText =
            document.getElementById(
                "buttonText"
            );


        /* =========================================
           EMAIL VALIDATION
        ========================================= */

        function validateEmail(value) {

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

            return emailPattern.test(
                value.trim()
            );
        }


        /* =========================================
           LIVE EMAIL VALIDATION
        ========================================= */

        email.addEventListener(
            "input",
            function() {

                if (
                    validateEmail(
                        email.value
                    )
                ) {

                    email.classList.remove(
                        "invalid"
                    );

                    email.classList.add(
                        "valid"
                    );

                    emailError.classList.remove(
                        "show"
                    );

                } else {

                    email.classList.remove(
                        "valid"
                    );
                }
            }
        );


        /* =========================================
           PASSWORD VALIDATION
        ========================================= */

        password.addEventListener(
            "input",
            function() {

                if (
                    password.value.length >= 6
                ) {

                    password.classList.add(
                        "valid"
                    );

                    password.classList.remove(
                        "invalid"
                    );

                    passwordError.classList.remove(
                        "show"
                    );

                } else {

                    password.classList.remove(
                        "valid"
                    );
                }
            }
        );


        /* =========================================
           LOGIN
        ========================================= */

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                let valid = true;


                /* Email */

                if (
                    !validateEmail(
                        email.value
                    )
                ) {

                    email.classList.add(
                        "invalid"
                    );

                    emailError.classList.add(
                        "show"
                    );

                    valid = false;

                } else {

                    email.classList.remove(
                        "invalid"
                    );

                    email.classList.add(
                        "valid"
                    );

                    emailError.classList.remove(
                        "show"
                    );
                }


                /* Password */

                if (
                    password.value.length < 6
                ) {

                    password.classList.add(
                        "invalid"
                    );

                    passwordError.classList.add(
                        "show"
                    );

                    valid = false;

                } else {

                    password.classList.remove(
                        "invalid"
                    );

                    password.classList.add(
                        "valid"
                    );

                    passwordError.classList.remove(
                        "show"
                    );
                }


                /* Stop if invalid */
if (!valid) {
    return;
}

loginButton.disabled = true;

buttonText.textContent =
    "AUTHENTICATING...";

setTimeout(function () {

    localStorage.setItem(
        "tronEmpireLoggedIn",
        "true"
    );

    buttonText.textContent =
        "ACCESS GRANTED";

    setTimeout(function () {

        window.location.replace(
            "index.html"
        );

    }, 500);

}, 1500);

            }
        );


        /* =========================================
           FORGOT PASSWORD
        ========================================= */

        document
            .getElementById(
                "forgotPassword"
            )
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    alert(
                        "Password recovery can be connected to your backend here."
                    );

                }
            );

    </script>

</body>
</html>
